<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1c1a"/>
      <stop offset="1" stop-color="#0d0e0d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7dbb6"/>
      <stop offset="1" stop-color="#9ebb8c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" fill="none" stroke="#2f322f"/>

  <!-- ezCLI identity: two bars (tall + short) -->
  <g transform="translate(192 128)" filter="url(#glow)">
    <rect x="0"   y="0"  width="48" height="256" rx="18" fill="url(#bar)"/>
    <rect x="80"  y="80" width="48" height="176" rx="18" fill="url(#bar)"/>
  </g>
</svg>
