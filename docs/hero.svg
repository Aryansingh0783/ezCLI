<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#ece6d8"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3c320f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- the mark -->
  <rect x="96" y="84" width="14" height="30" rx="3" fill="#c24a22"/>
  <rect x="116" y="68" width="14" height="46" rx="3" fill="#c24a22"/>

  <text x="96" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#1f1d19" letter-spacing="-1.5">ezCLI</text>
  <text x="96" y="248" font-size="28" fill="#3b372f">Run every coding CLI in one calm window.</text>
  <text x="96" y="288" font-size="18" fill="#6f695c">Claude Code, Codex, Gemini, OpenCode, Ollama and Freebuff,</text>
  <text x="96" y="314" font-size="18" fill="#6f695c">each in a real terminal.</text>

  <g font-size="15" fill="#3b372f">
    <rect x="96" y="346" width="168" height="34" rx="17" fill="#1f1d19" fill-opacity="0.06"/>
    <text x="115" y="368">Real CLI, no harness</text>
    <rect x="276" y="346" width="132" height="34" rx="17" fill="#1f1d19" fill-opacity="0.06"/>
    <text x="296" y="368">Compare agents</text>
    <rect x="420" y="346" width="116" height="34" rx="17" fill="#1f1d19" fill-opacity="0.06"/>
    <text x="440" y="368">Calm layout</text>
  </g>

  <!-- a window -->
  <g filter="url(#sh)">
    <rect x="700" y="64" width="484" height="312" rx="18" fill="#faf9f5"/>
  </g>
  <rect x="700" y="64" width="150" height="312" rx="18" fill="#f1ede3"/>
  <rect x="832" y="64" width="18" height="312" fill="#f1ede3"/>
  <text x="720" y="102" font-size="13" fill="#1f1d19">New session</text>
  <text x="720" y="124" font-size="13" fill="#c24a22">+</text>
  <rect x="712" y="146" width="126" height="28" rx="8" fill="#1f1d19" fill-opacity="0.09"/>
  <text x="724" y="165" font-size="13" fill="#1f1d19">landing-page</text>
  <text x="720" y="204" font-size="11" fill="#6f695c">Sessions</text>
  <circle cx="724" cy="224" r="3.5" fill="#c24a22"/><text x="736" y="228" font-size="12.5" fill="#3b372f">Polish the hero</text>
  <circle cx="724" cy="248" r="3.5" fill="#c24a22"/><text x="736" y="252" font-size="12.5" fill="#3b372f">Review accessibility</text>
  <text x="940" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1f1d19">Good afternoon</text>
  <rect x="884" y="178" width="276" height="112" rx="16" fill="#ffffff" stroke="#1f1d19" stroke-opacity="0.08"/>
  <text x="904" y="210" font-size="13" fill="#8a8374">Describe a task…</text>
  <text x="904" y="272" font-size="12" fill="#6f695c">Default</text>
  <text x="1008" y="272" font-size="12" fill="#3b372f">Claude Code</text>
  <rect x="1124" y="254" width="24" height="24" rx="7" fill="#c24a22"/>
  <path d="M1136 271V262M1132 266l4-4 4 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
