<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Second brain</title>
<style>
  :root { color-scheme: dark; --bg:#0c0d10; --panel:#14161b; --line:#262932; --text:#e7e8ea; --dim:#8b909b; --accent:#7cff3f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 1fr 340px; height:100%; }
  #stage { position:relative; min-width:0; }
  canvas { width:100%; height:100%; display:block; cursor:grab; background:radial-gradient(circle at 50% 40%, #171a22 0%, #0c0d10 70%); }
  canvas.drag { cursor:grabbing; }
  #hud { position:absolute; left:12px; bottom:12px; display:flex; gap:8px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { border-color:var(--accent); color:var(--accent); }
  #side { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side header { padding:12px; border-bottom:1px solid var(--line); }
  #q { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  #q:focus { outline:none; border-color:var(--accent); }
  #projects { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { display:flex; align-items:center; gap:6px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); cursor:pointer; user-select:none; font-size:12px; }
  .chip.off { opacity:.35; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  #panel { flex:1; overflow:auto; padding:12px; min-height:0; }
  h2 { margin:0 0 2px; font-size:15px; } .sub { color:var(--dim); margin-bottom:10px; }
  .row { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .row:hover { background:rgba(255,255,255,.06); }
  .row small { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%; }
  .hint { color:var(--dim); } .how { background:rgba(124,255,63,.07); border:1px solid rgba(124,255,63,.22); border-radius:10px; padding:10px 12px; margin-bottom:12px; } .how b { color:var(--accent); } .sec { margin:14px 0 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); } .bar { height:3px; border-radius:2px; background:rgba(255,255,255,.12); margin-top:3px; } .bar i { display:block; height:100%; border-radius:2px; } #foot { padding:8px 12px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  #tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 9px; display:none; max-width:280px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div id="tip"></div>
    <div id="hud"><button id="fit">Fit</button><button id="labels" class="on">Labels</button><button id="freeze">Pause motion</button></div></div>
  <aside id="side">
    <header><input id="q" placeholder="Search projects, clusters, functions, files…" autocomplete="off" /><div id="projects"></div></header>
    <div id="panel"></div>
    <div id="foot"></div>
  </aside>
</div>
<script>
const DATA = /*DATA*/null;
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), tip = document.getElementById('tip');
  const $ = (id) => document.getElementById(id);
  const hue = (i) => `hsl(${(i * 137.5) % 360} 70% 62%)`;
  const nodes = [], links = [], byId = new Map(), projHidden = new Set();
  DATA.projects.forEach((p, pi) => {
    const color = hue(pi);
    const pn = { id: 'p' + pi, kind: 'project', label: p.name, pi, color, r: 20, size: p.nodes, p, x: Math.cos(pi * 2.4) * 300, y: Math.sin(pi * 2.4) * 300, vx: 0, vy: 0 };
    nodes.push(pn); byId.set(pn.id, pn);
    p.comms.forEach((c) => {
      const n = { id: `c${pi}_${c.id}`, kind: 'cluster', label: c.name, pi, color, r: 4 + Math.sqrt(c.size) * 1.1, size: c.size, c, x: pn.x + (Math.random() - .5) * 200, y: pn.y + (Math.random() - .5) * 200, vx: 0, vy: 0 };
      nodes.push(n); byId.set(n.id, n);
      links.push({ a: pn, b: n, w: 1, k: 'own' });
    });
    (p.links || []).forEach(([a, b, w]) => { const A = byId.get(`c${pi}_${a}`), B = byId.get(`c${pi}_${b}`); if (A && B) links.push({ a: A, b: B, w, k: 'dep' }); });
  });
  $('foot').textContent = `${DATA.projects.length} project${DATA.projects.length === 1 ? '' : 's'} · ${DATA.projects.reduce((s, p) => s + p.nodes, 0).toLocaleString()} symbols · ${nodes.length - DATA.projects.length} clusters` + (DATA.skipped.length ? ` · skipped ${DATA.skipped.length}` : '');
  const pj = $('projects');
  DATA.projects.forEach((p, pi) => {
    const el = document.createElement('div'); el.className = 'chip'; el.innerHTML = `<i style="background:${hue(pi)}"></i>${esc(p.name)} <span class="hint">${p.nodes.toLocaleString()}</span>`;
    el.onclick = () => { projHidden.has(pi) ? projHidden.delete(pi) : projHidden.add(pi); el.classList.toggle('off'); kick(); };
    pj.appendChild(el);
  });
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  let W = 0, H = 0, dpr = 1, view = { x: 0, y: 0, k: 1 }, hover = null, sel = null, drag = null, pan = null, paused = false, showLabels = true, heat = 1;
  const vis = (n) => !projHidden.has(n.pi);
  function resize() { dpr = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; draw(); }
  addEventListener('resize', resize);
  const toWorld = (sx, sy) => ({ x: (sx - W / 2) / view.k - view.x, y: (sy - H / 2) / view.k - view.y });
  const toScreen = (x, y) => ({ x: (x + view.x) * view.k + W / 2, y: (y + view.y) * view.k + H / 2 });

  function step() {
    const act = nodes.filter(vis); const n = act.length;
    for (let i = 0; i < n; i++) { const a = act[i];
      for (let j = i + 1; j < n; j++) { const b = act[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 90000) continue; const f = (a.kind === 'project' || b.kind === 'project' ? 5200 : 900) / d2, d = Math.sqrt(d2); dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f; } }
    for (const l of links) { if (!vis(l.a)) continue; const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = l.k === 'own' ? 70 + l.b.r * 2 : 90, f = (d - rest) * (l.k === 'own' ? 0.012 : 0.004 * Math.min(3, l.w)); const fx = dx / d * f, fy = dy / d * f;
      l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy; }
    for (const a of act) { a.vx -= a.x * 0.0016; a.vy -= a.y * 0.0016; if (a === drag) { a.vx = a.vy = 0; continue; } a.vx *= 0.82; a.vy *= 0.82; a.x += a.vx * heat; a.y += a.vy * heat; }
    heat = Math.max(0.04, heat * 0.992);
  }
  const nbrs = (n) => { const s = new Set([n]); for (const l of links) { if (l.a === n) s.add(l.b); if (l.b === n) s.add(l.a); } return s; };
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const focus = hover || sel, near = focus ? nbrs(focus) : null;
    for (const l of links) { if (!vis(l.a)) continue; const a = toScreen(l.a.x, l.a.y), b = toScreen(l.b.x, l.b.y);
      const on = focus && (l.a === focus || l.b === focus); ctx.globalAlpha = focus ? (on ? .85 : .05) : (l.k === 'own' ? .16 : .3);
      ctx.strokeStyle = on ? '#fff' : l.a.color; ctx.lineWidth = on ? 1.6 : Math.min(2.5, .6 + l.w * .2); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    const rects = [], later = [];
    for (const n of nodes) { if (!vis(n)) continue; const p = toScreen(n.x, n.y), r = Math.max(2, n.r * view.k); if (p.x < -50 || p.y < -50 || p.x > W + 50 || p.y > H + 50) continue;
      ctx.globalAlpha = focus && !near.has(n) ? .15 : 1; const gr = ctx.createRadialGradient(p.x - r * .3, p.y - r * .3, r * .1, p.x, p.y, r); gr.addColorStop(0, '#ffffffcc'); gr.addColorStop(.25, n.color); gr.addColorStop(1, n.color); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
      if (n === sel || n === hover) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      later.push({ n, p, r }); }
    drawLabels(later, rects, focus, near);
    ctx.globalAlpha = 1;
  }
  function drawLabels(list, rects, focus, near) {
    if (!showLabels && !focus) { list = list.filter((x) => x.n.kind === 'project'); }
    list.sort((a, b) => (b.n === sel) - (a.n === sel) || (b.n === hover) - (a.n === hover) || (b.n.kind === 'project') - (a.n.kind === 'project') || b.n.size - a.n.size);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (const { n, p, r } of list) {
      if (p.x < -40 || p.y < -40 || p.x > W + 40 || p.y > H + 40) continue;
      const strong = n === sel || n === hover || n.kind === 'project';
      if (focus && !strong && !near.has(n)) continue;
      if (!strong && !focus && n.size * view.k * view.k < 3) continue;
      const txt = n.label.length > 34 ? n.label.slice(0, 33) + '…' : n.label;
      ctx.font = (n.kind === 'project' ? '600 13px' : strong ? '600 12px' : '12px') + ' system-ui, "Segoe UI", sans-serif';
      const w = ctx.measureText(txt).width + 10, x = p.x - w / 2, y = p.y - r - 22, hgt = 18;
      if (!strong && rects.some((q) => x < q[0] + q[2] && x + w > q[0] && y < q[1] + q[3] && y + hgt > q[1])) continue;
      rects.push([x, y, w, hgt]);
      ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(12,13,16,.82)'; ctx.beginPath(); ctx.roundRect(x, y, w, hgt, 6); ctx.fill();
      ctx.fillStyle = n.kind === 'project' ? '#fff' : '#dfe2e8'; ctx.fillText(txt, p.x, y + 13);
    }
    ctx.globalAlpha = 1;
  }
  function loop() { if (!paused) step(); tickAnim(); draw(); requestAnimationFrame(loop); }
  const kick = () => { heat = 1; };
  function pick(sx, sy) { const w = toWorld(sx, sy); let best = null, bd = 1e9; for (const n of nodes) { if (!vis(n)) continue; const d = Math.hypot(n.x - w.x, n.y - w.y); if (d < Math.max(n.r, 6 / view.k) + 3 / view.k && d < bd) { best = n; bd = d; } } return best; }
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('mousedown', (e) => { const p = pos(e), n = pick(p.x, p.y); if (n) { drag = n; drag.moved = false; kick(); } else pan = { sx: p.x, sy: p.y, vx: view.x, vy: view.y }; cv.classList.add('drag'); });
  addEventListener('mousemove', (e) => { const p = pos(e);
    if (drag) { const w = toWorld(p.x, p.y); drag.x = w.x; drag.y = w.y; drag.moved = true; kick(); }
    else if (pan) { view.x = pan.vx + (p.x - pan.sx) / view.k; view.y = pan.vy + (p.y - pan.sy) / view.k; }
    else { const n = pick(p.x, p.y); if (n !== hover) { hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; }
      if (n) { tip.style.display = 'block'; tip.style.left = Math.min(p.x + 14, W - 290) + 'px'; tip.style.top = p.y + 14 + 'px'; tip.innerHTML = `<b>${esc(n.label)}</b><div class="hint">${n.kind === 'project' ? 'project' : esc(DATA.projects[n.pi].name)} · ${n.size.toLocaleString()} ${n.kind === 'project' ? 'symbols' : 'members'}</div>`; } else tip.style.display = 'none'; } });
  addEventListener('mouseup', () => { if (drag && !drag.moved) select(drag); drag = null; pan = null; cv.classList.remove('drag'); });
  cv.addEventListener('dblclick', (e) => { const p = pos(e), n = pick(p.x, p.y); if (n) focusOn(n, 2.6); });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const p = pos(e), before = toWorld(p.x, p.y); view.k = Math.min(8, Math.max(.12, view.k * Math.exp(-e.deltaY * .0015))); const after = toWorld(p.x, p.y); view.x += after.x - before.x; view.y += after.y - before.y; }, { passive: false });
  let anim = null;
  function focusOn(n, k) { anim = { x: -n.x, y: -n.y, k: k || view.k }; }
  function tickAnim() { if (!anim) return; view.x += (anim.x - view.x) * .18; view.y += (anim.y - view.y) * .18; view.k += (anim.k - view.k) * .18; if (Math.abs(anim.x - view.x) + Math.abs(anim.y - view.y) < .5 && Math.abs(anim.k - view.k) < .01) anim = null; }
  function fit() { const a = nodes.filter(vis); if (!a.length) return; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const n of a) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
    view.x = -(x0 + x1) / 2; view.y = -(y0 + y1) / 2; view.k = Math.min(2, .9 * Math.min(W / (x1 - x0 + 120), H / (y1 - y0 + 120))); }
  $('fit').onclick = fit; $('labels').onclick = (e) => { showLabels = !showLabels; e.target.classList.toggle('on', showLabels); };
  $('freeze').onclick = (e) => { paused = !paused; e.target.classList.toggle('on', paused); e.target.textContent = paused ? 'Resume motion' : 'Pause motion'; };


  function overview() { const panel = $('panel');
    const how = `<div class="how"><b>What is this?</b><br>Every circle is a group of code that belongs together. Bigger means more code. A line means one group calls into another. It's a map of your projects, so you (and your agents) can see where things live.<br><br><b>Try:</b> click a circle to see what's inside, search for a function or file, or pick a project below.</div>`;
    const idx = DATA.projects.map((p, pi) => { const top = [...p.comms].sort((a, b) => b.size - a.size).slice(0, 8);
      return `<div class="sec" style="color:${hue(pi)}">${esc(p.name)} · ${p.nodes.toLocaleString()} symbols</div>` + top.map((c) => `<div class="row" data-c="c${pi}_${c.id}"><span>${esc(c.name)}</span><small>${c.size.toLocaleString()}</small></div>`).join(''); }).join('');
    panel.innerHTML = how + idx; }
  function select(n) { sel = n; const panel = $('panel');
    if (!n) { overview(); return; }
    if (n.kind === 'project') { const p = n.p; panel.innerHTML = `<h2>${esc(p.name)}</h2><div class="sub">${esc(p.path)}<br>${p.nodes.toLocaleString()} symbols · ${p.edges.toLocaleString()} links · ${p.comms.length} clusters shown</div>` +
      `<div class="sec">Biggest areas</div>` + [...p.comms].sort((a, b) => b.size - a.size).slice(0, 40).map((c) => `<div class="row" data-c="c${n.pi}_${c.id}"><span>${esc(c.name)}</span><small>${c.size.toLocaleString()}</small></div>`).join(''); }
    else { const c = n.c, nb = [...nbrs(n)].filter((x) => x !== n && x.kind === 'cluster');
      panel.innerHTML = `<h2>${esc(c.name)}</h2><div class="sub">${esc(DATA.projects[n.pi].name)} · ${c.size.toLocaleString()} functions and classes</div><div class="sec">Where this code lives</div>` + c.files.map((f) => `<div class="row" data-copy="${esc(f[0])}"><span>${esc(f[0].split(/[\\/]/).pop())}</span><small>${esc(f[0])} · ${f[1]}</small></div>`).join('') + `<div class="sec">Most connected functions</div>` +
        c.top.slice(0, 20).map((m) => `<div class="row" data-copy="${esc(m[1] + (m[2] ? ':' + m[2] : ''))}"><span>${esc(m[0])}</span><small>${esc(m[1])}${m[2] ? ':' + esc(m[2]) : ''}</small></div>`).join('') +
        (nb.length ? `<div class="sec">Calls into / called by</div>` + nb.slice(0, 12).map((x) => `<div class="row" data-c="${x.id}"><span>${esc(x.label)}</span><small>${x.size}</small></div>`).join('') : ''); }
    kick(); }
  $('panel').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (!r) return; if (r.dataset.c) { const n = byId.get(r.dataset.c); select(n); focusOn(n, Math.max(view.k, 1.6)); }
    else if (r.dataset.copy) { navigator.clipboard && navigator.clipboard.writeText(r.dataset.copy).catch(() => {}); r.style.background = 'rgba(124,255,63,.18)'; } });

  $('q').addEventListener('input', (e) => { const q = e.target.value.trim().toLowerCase(); if (!q) { select(null); return; }
    const hits = []; for (const n of nodes) { if (!vis(n)) continue; const nm = n.label.toLowerCase().includes(q); let m = null; if (n.kind === 'cluster') m = n.c.top.find((t) => t[0].toLowerCase().includes(q) || t[1].toLowerCase().includes(q));
      if (nm || m) hits.push({ n, why: nm ? '' : `${m[0]} · ${m[1]}` }); }
    hits.sort((a, b) => b.n.size - a.n.size); $('panel').innerHTML = hits.length ? `<div class="hint" style="margin-bottom:6px">${hits.length} match${hits.length === 1 ? '' : 'es'}</div>` + hits.slice(0, 50).map((h) => `<div class="row" data-c="${h.n.id}"><span>${esc(h.n.label)}</span><small>${esc(h.why || DATA.projects[h.n.pi].name)}</small></div>`).join('') : '<p class="hint">No match.</p>'; });

  addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } if (e.key === 'Escape') { $('q').value = ''; select(null); } });
  resize(); overview(); for (let i = 0; i < 250; i++) step(); fit(); heat = .5; loop();
})();
</script>
</body>
</html>
