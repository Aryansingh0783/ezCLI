[package]
name = "ezcli"
version = "1.0.0"
description = "A desktop window for the Claude and OpenAI coding CLIs"
authors = ["Aryan Singh"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ezcli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
portable-pty = "0.8"
dashmap = "6"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
