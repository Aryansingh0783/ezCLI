[package]
name = "ezcli"
version = "3.0.1"
description = "A desktop window for the Claude and OpenAI coding CLIs"
authors = ["Aryan Singh"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ezcli_lib"
# Desktop only. The Tauri template's "staticlib"/"cdylib" exist for mobile
# targets; on the Windows GNU toolchain the cdylib exports every symbol and
# fails with "export ordinal too large" (DLLs cap out at 65,535 exports).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
portable-pty = "0.8"
dashmap = "6"
dirs = "5"
# PC control (PR 4b). All three are already resolved in Cargo.lock through
# tauri, so declaring them adds no new crate downloads.
png = "0.17"
base64 = "0.22"
getrandom = "0.2"
# Update verification (already in Cargo.lock through tauri).
sha2 = "0.10"
# QR code for the remote view URL, rendered as SVG only.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
