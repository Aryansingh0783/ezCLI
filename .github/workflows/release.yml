name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Compiling tauri-cli from source eats 4-6 minutes every build.
      # The project ships prebuilt binaries per host, so we grab one and
      # drop it on PATH as `cargo-tauri`.
      - name: Install Tauri CLI (prebuilt)
        shell: pwsh
        run: |
          $tag = gh api repos/tauri-apps/tauri/releases --jq '.[] | select(.tag_name | startswith("tauri-cli-v2.")) | .tag_name' | Select-Object -First 1
          Write-Host "Using Tauri CLI $tag"
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest -UseBasicParsing "https://github.com/tauri-apps/tauri/releases/download/$tag/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP 'cargo-tauri'
          Expand-Archive -Force $zip -DestinationPath $dir
          "$dir" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
          & "$dir\cargo-tauri.exe" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build MSI
        shell: pwsh
        run: |
          # `target` is cached for compiler outputs. Bundle artifacts are release
          # payloads, not compiler outputs: a cached older MSI must never be
          # considered for this tag.
          $msiDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle/msi'
          if (Test-Path -LiteralPath $msiDir) {
            Remove-Item -LiteralPath $msiDir -Recurse -Force
          }
          cargo tauri build --bundles msi
        working-directory: ${{ github.workspace }}

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $tauri = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string] $tauri.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'src-tauri/tauri.conf.json has no usable version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match Tauri version '$version'."
          }
          $msiDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle/msi'
          if (-not (Test-Path -LiteralPath $msiDir)) {
            throw "MSI output directory was not created: $msiDir"
          }
          $expectedName = "ezCLI_${version}_x64_en-US.msi"
          $msi = Get-Item -LiteralPath (Join-Path $msiDir $expectedName) -ErrorAction SilentlyContinue
          if (-not $msi) {
            $found = (Get-ChildItem -LiteralPath $msiDir -Filter '*.msi' -File | Select-Object -ExpandProperty Name) -join ', '
            throw "Expected $expectedName for tauri.conf.json version $version; found: $found"
          }
          Write-Host "::notice::built $($msi.Name)  ($([math]::Round($msi.Length/1MB,2)) MB)"
          "msi_path=$($msi.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "msi_name=$($msi.Name)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcli-windows-msi
          path: ${{ steps.collect.outputs.msi_path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.msi_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
