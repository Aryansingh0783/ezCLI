name: CI

# Runs on every pull request and every push to main, so a broken test, a lint warning or a front end that
# throws on start is caught before it is merged (not after it is released).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      # Tauri embeds dist/ at compile time, so the front end is built before any cargo step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the front end
        run: |
          npm ci
          npm run build
      # --locked: the committed Cargo.lock must already match Cargo.toml
      - name: Lint (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked --lib

  frontend:
    name: Front end
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Types (the whole front end, and the strict core)
        run: |
          npm run typecheck
          npx tsc --noEmit -p tsconfig.test.json
      - name: IPC types match the Rust commands
        run: npm run ipc:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npx vite build
      - name: Config files are valid JSON
        run: |
          node -e "for (const f of ['agents.json','src-tauri/tauri.conf.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: App version is the same everywhere
        run: |
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          lock=$(grep -A1 '^name = "ezcli"$' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "tauri.conf.json=$conf Cargo.toml=$cargo Cargo.lock=$lock"
          [ "$conf" = "$cargo" ] && [ "$conf" = "$lock" ] || { echo "::error::Version mismatch between tauri.conf.json, Cargo.toml and Cargo.lock"; exit 1; }
      - name: UI smoke test (headless browser)
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke
